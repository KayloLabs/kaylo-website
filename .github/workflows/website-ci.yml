name: Website checks

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # main holds the generated Pages site, never the application source.
    if: github.ref == 'refs/heads/source'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /kaylo-website
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test lib/*.test.ts
      - run: node --test server/worker.test.mjs scripts/verify-pages.test.mjs
      - run: npm run build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: kaylo-pages-${{ github.sha }}
          path: out/
          include-hidden-files: true
          retention-days: 7
