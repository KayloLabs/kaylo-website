name: Website checks

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # main holds the generated Pages site, never the application source.
    if: github.ref == 'refs/heads/source'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /kaylo-website
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test lib/*.test.ts
      - run: node --test server/worker.test.mjs scripts/verify-pages.test.mjs scripts/build-worker.test.mjs scripts/secure-export.test.mjs scripts/security-dependencies.test.mjs
      - run: npm run build:pages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaylo-pages-${{ github.sha }}
          path: out/
          include-hidden-files: true
          retention-days: 7

  root_export:
    # The custom domain and Sites preview serve the same site at the URL root.
    # Keep its artifact separate from main's /kaylo-website Pages export.
    needs: verify
    if: github.ref == 'refs/heads/source'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaylo-root-${{ github.sha }}
          path: out/
          include-hidden-files: true
          retention-days: 7
